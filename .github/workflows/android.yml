
name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil kode proyek
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Periksa proyek Android
        run: |
          if [ ! -f "gradlew" ]; then
            echo "::error::File gradlew belum ada. Proyek Android perlu ditambahkan terlebih dahulu."
            exit 1
          fi

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bangun APK debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: ebook-creator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
